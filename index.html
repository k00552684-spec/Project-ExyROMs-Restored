<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Project ExyROMs</title>

  <!-- Google Fonts for Brutalist Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Exact Color Palette from Video */
      --bg-base: #E8E5D5; /* The specific warm beige */
      --text-main: #1C1C1C; /* Near Black */
      --accent-yellow: #FFC000; /* The highlight yellow from the video */
      --text-light: #6E6E6E;

      --font-display: 'Anton', sans-serif; /* Super bold, tight typography */
      --font-body: 'Space Grotesk', sans-serif; /* Clean, modern sans */
      --font-mono: 'JetBrains Mono', monospace; /* Tech data */

      --radius-pill: 999px;
      --border-thick: 2px solid var(--text-main);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-body);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Minimalist Navbar */
    .navbar {
      position: fixed; top: 0; left: 0; width: 100%;
      padding: 1.5rem 2rem;
      display: flex; justify-content: space-between; align-items: flex-start;
      z-index: 100;
      mix-blend-mode: difference; /* Makes text invert over images */
      color: #fff;
    }

    .nav-left { display: flex; flex-direction: column; }
    .nav-logo { font-family: var(--font-display); font-size: 2.5rem; line-height: 1; text-transform: uppercase; letter-spacing: 1px; }
    .nav-sub { font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.8; }

    .menu-btn {
      width: 40px; height: 16px; display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; background: transparent; border: none;
    }
    .menu-btn span { display: block; width: 100%; height: 3px; background-color: #fff; }

    /* Hero Section (Giant Typography) */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 2rem;
      position: relative;
    }

    .hero-text-wrap {
      z-index: 10;
      position: relative;
      margin-top: 5rem;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(5rem, 15vw, 12rem);
      line-height: 0.85;
      text-transform: uppercase;
      color: var(--text-main);
      white-space: nowrap;
    }

    .hero-title span { color: transparent; -webkit-text-stroke: 1px var(--text-main); } /* Hollow text effect */

    /* Accordion / Content Section */
    .content-wrapper {
      padding: 4rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.9;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    /* The Video's Accordion Style */
    .accordion-item {
      border-top: var(--border-thick);
      border-bottom: var(--border-thick);
      margin-bottom: -2px; /* Overlap borders */
      background: var(--bg-base);
    }

    .accordion-header {
      width: 100%;
      padding: 1.5rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
    }

    .accordion-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 4rem);
      text-transform: uppercase;
      color: var(--text-main);
      line-height: 1;
    }

    .accordion-icon {
      width: 40px; height: 40px;
      border: var(--border-thick);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 400;
      transition: transform 0.3s ease;
    }

    .accordion-header.active .accordion-icon { transform: rotate(45deg); }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Inside the accordion - specific data styling */
    .build-data-grid {
      padding: 0 0 2rem 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media(min-width: 768px) {
      .build-data-grid { grid-template-columns: 1fr 1fr; }
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--text-main);
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: uppercase;
    }

    .data-row span:last-child { font-family: var(--font-mono); }

    /* The Pill Tags (From the video) */
    .tag-container {
      display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.5rem;
      justify-content: center;
    }

    .pill-tag {
      border: 1px solid var(--text-main);
      border-radius: var(--radius-pill);
      padding: 0.4rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      background: transparent;
      color: var(--text-main);
    }

    .pill-tag.highlight {
      background: var(--accent-yellow);
      border-color: var(--accent-yellow);
    }

    /* Black Pill Button */
    .btn-black {
      display: block; width: 100%; max-width: 300px;
      margin: 2rem auto 0 auto;
      background: var(--text-main); color: var(--accent-yellow);
      font-family: var(--font-body); font-weight: 700;
      text-transform: uppercase; text-align: center; text-decoration: none;
      padding: 1.25rem; border-radius: var(--radius-pill);
      border: 2px solid var(--text-main);
      transition: all 0.2s;
    }
    
    .btn-black:hover {
      background: transparent; color: var(--text-main);
    }

    /* Changelog Text */
    .changelog-text {
      font-family: var(--font-body);
      font-size: 1rem; line-height: 1.5;
      margin-top: 1.5rem;
      white-space: pre-line;
    }

    /* Footer styling similar to the video */
    footer {
      background: var(--text-main);
      color: var(--bg-base);
      padding: 4rem 2rem;
      margin-top: 4rem;
    }

    .footer-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 10vw, 8rem);
      line-height: 0.8;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    
    .footer-title span { color: transparent; -webkit-text-stroke: 1px var(--bg-base); }

    .footer-info {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      text-transform: uppercase;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Minimal Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="#" class="nav-logo">EXY</a>
      <span class="nav-sub">Project Firmwares</span>
    </div>
    <button class="menu-btn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Giant Typography Hero -->
  <section class="hero">
    <div class="hero-text-wrap">
      <h1 class="hero-title">
        A NEW LOOK<br>
        <span>AT A FAMILIAR</span><br>
        DEVICE.
      </h1>
    </div>
  </section>

  <!-- Main Content Area -->
  <div class="content-wrapper">
    <h2 class="section-title">THE <span>ROMS</span></h2>
    
    <div id="buildsList">
      <!-- Accordions will be injected here -->
    </div>
  </div>

  <!-- Brutalist Footer -->
  <footer>
    <h2 class="footer-title">DON'T MISS<br><span>NEW BUILDS</span></h2>
    <div class="footer-info">
      <p>MAINTAINED BY PARBINDAR7</p>
      <p>TELEGRAM: @EXYROMS</p>
      <p style="margin-top: 2rem; opacity: 0.5;">EXYNOS 9611 DEVELOPMENT HUB &copy; 2026</p>
    </div>
  </footer>

  <script>
    // Your exact original database
    const buildsData = [
      {
        title: "Everline kernel", category: "kernel", device: "Samsung Galaxy A51, F41, M31, M31s, M21", android: "Android 13 to 16", date: "26 July 2026", maintainer: "PARBINDAR7", flavor: ["BALANCED"],
        changelog: "1. sched/uclamp: Move tunables to cpuctl\n2. sched/uclamp: Expose latency_sensitive and uclamp.boosted",
        downloadUrl: "https://sourceforge.net/projects/parbindar7-builds/files/Everline%2025-07-2026/"
      },
      {
        title: "Project Matrixx OS v12.3", category: "rom", device: "Samsung Galaxy A51, F41, M31, M31s, M21", android: "Android 16", date: "May 2026", maintainer: "PARBINDAR7", flavor: ["INACTIVE"],
        changelog: "1. Contains all previous commits\nNOTICE: Project Matrixx OS has been officially discontinued as per the announcement of Matrixx OS Developers.",
        downloadUrl: "https://sourceforge.net/projects/projectmatrixx/files/Android-16/"
      },
      {
        title: "InfinityX v3.10", category: "rom", device: "Samsung Galaxy A51, F41, M31, M31s, M21", android: "Android 16", date: "05 May 2026", maintainer: "PARBINDAR7", flavor: ["GAPPS INCLUDED"],
        changelog: "1. Contains all previous commits\n2. OTA push",
        downloadUrl: "https://github.com/Parbindar7/OTA/releases/tag/InfinityX_06-05-2026"
      },
      {
        title: "Afterlife OS v8.4", category: "rom", device: "Samsung Galaxy A51, F41, M31, M31s, M21", android: "Android 16", date: "23 April 2026", maintainer: "PARBINDAR7", flavor: ["INACTIVE"],
        changelog: "1. Enable frame pacing\n2. Define screenRecorderAVCProfileLevel\n3. Decrease launch boost to 3sec\n4. Tune schedutil rate limits\n5. HWC Adapted from exynos9630 T BSP\n6. Adapted struct decon_win_config_data to exynos9610\n7. Fix missing dmabuf_trace_free call on buffer release path\n8. Free exporter name on buffer release\n9. CONFIG_HZ to 300",
        downloadUrl: "https://afterlifeos.com/download"
      },
      {
        title: "Voltage OS v5.8", category: "rom", device: "Samsung Galaxy A51, F41, M31, M31s, M21", android: "Android 16", date: "25 April 2026", maintainer: "PARBINDAR7", flavor: ["VANILLA"],
        changelog: "1. Re-tune POWERHINT for efficiency\n2. Boost CPU on EXPENSIVE_RENDERING\n3. Set TARGET_CPU_VARIANT to cortex-a73",
        downloadUrl: "https://drive.google.com/drive/folders/16UW_O8Megsh4MpqPprNJgv4JV1j4taP5?usp=sharing"
      },
      {
        title: "LunarisAOSP v3.12 ", category: "rom", device: "Samsung Galaxy A51, F41, M31, M31s, M21", android: "Android 16", date: "01 July 2026", maintainer: "PARBINDAR7", flavor: ["VANILLA"],
        changelog: "1. Remove unused /dev/freezer\n2. Tune up/down frequency transition rate limits\n3. Switch to AOSP task profiles",
        downloadUrl: "https://drive.google.com/drive/folders/1_RG0oDENhUGLcEh5kDkDNwOtc5VT5s3t"
      },
      {
        title: "LineageOS EXT", category: "rom", device: "Samsung Galaxy A51, F41, M31, M31s, M21", android: "Android 17", date: "10 August 2026", maintainer: "PARBINDAR7", flavor: ["VANILLA"],
        changelog: "1. Update included soong namespaces\n2. Set legacy gralloc flag\n3. Remove apk_verity_prop from flags_health_check.te\n4. Remove duplicate sysfs_block\n5. Remove duplicate clean_scratch_files\n6. Use legacy libion implementation\n7. Disable app launch blur",
        downloadUrl: "https://drive.google.com/drive/folders/11VAKKkzQEnQ-hCucJFv6She-AtUQNiDo?usp=sharing"
      },
      {
        title: "PixelOS v16.2", category: "rom", device: "Samsung Galaxy A51, F41, M31, M31s, M21", android: "Android 16", date: "17 August 2026", maintainer: "PARBINDAR7", flavor: ["GAPPS"],
        changelog: "1. GPU Frequency set to 949mhz\n2. Blur disabled",
        downloadUrl: "https://drive.google.com/drive/folders/1y9wpS1P07NaXY9XiLxwQLYonk-ucRgDv"
      },
      {
        title: "TWRP Recovery v3.7.1", category: "recovery", device: "All Supported Devices", android: "Android 13 to 17", date: "2026", maintainer: "TWRP Team", flavor: ["FLASHABLE ZIP/TAR"],
        changelog: "1. Fully compatible with Android 16 & 17 custom ROMs",
        downloadUrl: "https://twrp.me/Devices/"
      },
      {
        title: "LiteGapps", category: "gapps", device: "ARM64 Devices", android: "Android 17", date: "2026", maintainer: "LiteGapps", flavor: ["GOOGLE APPS PACKAGE"],
        changelog: "1. Official litegapps release packages for custom rom Android 17",
        downloadUrl: "https://sourceforge.net/projects/litegapps/files/litegapps/arm64/37/core/2026-05-13/"
      }
    ];

    function renderTags(flavorArray) {
      if (!flavorArray) return '';
      return flavorArray.map(f => {
        let cls = 'pill-tag';
        if (f.toUpperCase().includes('GAPPS') || f.toUpperCase().includes('BALANCED')) {
          cls += ' highlight';
        }
        return `<div class="${cls}">${f}</div>`;
      }).join('');
    }

    function createAccordionHTML(item, index) {
      const cat = (item.category || "rom").toUpperCase();
      const safeChangelog = (item.changelog || '').trim();

      return `
        <div class="accordion-item">
          <button class="accordion-header" onclick="toggleAccordion(this)">
            <span class="accordion-title">${item.title}</span>
            <div class="accordion-icon">+</div>
          </button>
          
          <div class="accordion-content">
            <div class="build-data-grid">
              
              <div>
                <div class="data-row"><span>Type</span><span>${cat}</span></div>
                <div class="data-row"><span>Target OS</span><span>${item.android}</span></div>
                <div class="data-row"><span>Build Date</span><span>${item.date}</span></div>
                <div class="data-row"><span>Maintainer</span><span>${item.maintainer}</span></div>
              </div>

              <div>
                <p style="font-family: var(--font-display); font-size: 1.5rem; text-transform: uppercase;">Changelog</p>
                <div class="changelog-text">${safeChangelog}</div>
                
                <div class="tag-container" style="justify-content: flex-start; margin-top: 1rem;">
                  <div class="pill-tag">${item.device}</div>
                  ${renderTags(item.flavor)}
                </div>
              </div>
              
            </div>
            
            <a href="${item.downloadUrl}" target="_blank" class="btn-black">DOWNLOAD BUILD</a>
            <div style="height: 2rem;"></div> <!-- Spacing -->
          </div>
        </div>
      `;
    }

    function renderBuilds() {
      const container = document.getElementById("buildsList");
      let htmlBuffer = "";
      
      buildsData.forEach((item, index) => {
        htmlBuffer += createAccordionHTML(item, index);
      });
      
      container.innerHTML = htmlBuffer;
    }

    function toggleAccordion(button) {
      // Close all other accordions
      const allHeaders = document.querySelectorAll('.accordion-header');
      allHeaders.forEach(header => {
        if (header !== button) {
          header.classList.remove('active');
          header.querySelector('.accordion-icon').innerText = '+';
          header.nextElementSibling.style.maxHeight = null;
        }
      });

      // Toggle current accordion
      button.classList.toggle('active');
      const icon = button.querySelector('.accordion-icon');
      const content = button.nextElementSibling;
      
      if (button.classList.contains('active')) {
        icon.innerText = '-';
        content.style.maxHeight = content.scrollHeight + 100 + "px"; // Add padding buffer
      } else {
        icon.innerText = '+';
        content.style.maxHeight = null;
      }
    }

    // Initialize
    renderBuilds();
  </script>
</body>
</html>
