<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Project ExyROMs</title>

  <!-- High-End Typography: 'Anton' for the massive bold text, 'Space Grotesk' for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* The exact 'Developer Flex' color palette from the video */
      --bg-cream: #EAE6DF; /* That specific warm vintage off-white */
      --bg-black: #000000;
      --bg-dark-panel: #111111;
      
      --text-dark: #000000;
      --text-light: #EAE6DF;
      --text-muted: #888888;

      --font-display: 'Anton', sans-serif;
      --font-body: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --border-thin: 1px solid var(--text-dark);
      --border-light: 1px solid rgba(234, 230, 223, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; background: var(--bg-cream); }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      font-family: var(--font-body);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* --- Pre-Loader (0 to 100%) --- */
    #loader {
      position: fixed; inset: 0;
      background: var(--bg-black);
      z-index: 9999;
      display: flex; justify-content: center; align-items: center;
      transition: transform 1s cubic-bezier(0.85, 0, 0.15, 1); /* Slide up animation */
    }
    #loader.hidden { transform: translateY(-100%); }
    
    #loader-text {
      font-family: var(--font-display);
      font-size: 6rem;
      color: var(--text-light);
    }

    /* --- Minimal Navbar --- */
    nav {
      position: fixed; top: 0; left: 0; width: 100%;
      padding: 1.5rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100;
      mix-blend-mode: difference; /* Critical for black/white overlapping */
      color: #fff;
    }

    .nav-logo {
      font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 2px;
      text-transform: uppercase; text-decoration: none; color: inherit;
    }

    .nav-links {
      display: flex; gap: 2rem;
      font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700;
      text-transform: uppercase;
    }
    .nav-links a { color: inherit; text-decoration: none; cursor: pointer; transition: opacity 0.2s;}
    .nav-links a:hover { opacity: 0.6; }

    @media (max-width: 768px) { .nav-links { display: none; } }

    /* --- The Massive Kinetic Hero Section --- */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 0 2rem; position: relative;
    }

    /* The huge distorted text from the video */
    .hero-title-huge {
      font-family: var(--font-display);
      font-size: clamp(6rem, 18vw, 15rem);
      line-height: 0.8;
      text-transform: uppercase;
      color: var(--text-dark);
      text-align: center;
      margin-top: 4rem;
      /* Subtle CSS text manipulation to mimic that stretched/custom look */
      transform: scaleY(1.3); 
      letter-spacing: -0.02em;
    }

    .hero-subtitle {
      font-family: var(--font-body); font-weight: 700; font-size: clamp(1.5rem, 4vw, 2.5rem);
      text-transform: uppercase; letter-spacing: 0.2em;
      margin-top: 3rem; text-align: center;
    }

    /* Scrolling ticker tape under hero */
    .ticker-wrap {
      width: 100%; overflow: hidden; white-space: nowrap;
      border-top: var(--border-thin); border-bottom: var(--border-thin);
      padding: 0.75rem 0; margin-top: 4rem;
      font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700;
      text-transform: uppercase;
    }
    .ticker {
      display: inline-block; animation: ticker 20s linear infinite;
    }
    .ticker-item { margin: 0 2rem; }
    @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }

    /* --- The Dark Portfolio Section --- */
    .dark-section {
      background: var(--bg-black); color: var(--text-light);
      padding: 8rem 2rem;
      position: relative; z-index: 2;
    }

    .container { max-width: 1200px; margin: 0 auto; width: 100%; }

    .section-title-dark {
      font-family: var(--font-display); font-size: clamp(4rem, 12vw, 8rem);
      line-height: 0.8; text-transform: uppercase; margin-bottom: 4rem;
      color: var(--text-light); border-bottom: var(--border-light); padding-bottom: 1rem;
    }
    .section-title-dark span { color: transparent; -webkit-text-stroke: 1px var(--text-light); }

    /* --- Brutalist List Layout for ROMs --- */
    .builds-list { display: flex; flex-direction: column; }

    .build-row {
      display: grid; grid-template-columns: 1fr; gap: 1rem;
      padding: 2.5rem 0; border-bottom: var(--border-light);
      transition: background 0.3s;
    }

    @media (min-width: 768px) {
      .build-row { grid-template-columns: 2fr 1.5fr 1fr 1fr; align-items: center; }
    }

    .build-row:hover { background: rgba(255,255,255,0.03); }
    .build-row:hover .build-name { transform: translateX(10px); }

    .build-name {
      font-family: var(--font-display); font-size: 2.5rem; line-height: 1; text-transform: uppercase;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .build-device { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;}
    
    .build-meta { display: flex; flex-direction: column; gap: 0.25rem; font-family: var(--font-mono); font-size: 0.8rem; }
    .meta-label { color: var(--text-muted); font-size: 0.6rem; }
    
    .build-actions { display: flex; flex-direction: column; gap: 0.5rem; justify-content: flex-end; }

    .btn-brutal {
      background: transparent; color: var(--text-light); border: 1px solid var(--text-light);
      padding: 0.75rem 1rem; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; cursor: pointer; text-align: center; text-decoration: none;
      transition: all 0.2s; border-radius: 4px;
    }
    .btn-brutal:hover { background: var(--text-light); color: var(--bg-black); }

    /* --- Modals for Changelog (Minimalist Dark) --- */
    .overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95);
      z-index: 2000; display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 1rem;
    }
    .overlay.active { opacity: 1; pointer-events: all; }

    .modal-content {
      background: var(--bg-dark-panel); border: 1px solid rgba(255,255,255,0.2);
      padding: 3rem; max-width: 600px; width: 100%; position: relative;
      transform: translateY(20px); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .overlay.active .modal-content { transform: translateY(0); }

    .modal-title { font-family: var(--font-display); font-size: 2.5rem; text-transform: uppercase; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 1rem; }
    
    .modal-close {
      position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none;
      color: var(--text-light); cursor: pointer; font-family: var(--font-mono); font-size: 1rem;
    }

    .changelog-box {
      font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-muted);
      line-height: 1.6; max-height: 50vh; overflow-y: auto; white-space: pre-line;
    }
    .changelog-box b { color: var(--text-light); }

    /* Footer */
    footer {
      background: var(--bg-cream); color: var(--text-dark);
      padding: 6rem 2rem; text-align: center;
    }
    .footer-huge {
      font-family: var(--font-display); font-size: clamp(3rem, 10vw, 8rem);
      line-height: 0.9; text-transform: uppercase; margin-bottom: 2rem;
    }
  </style>
</head>
<body>

  <!-- Percentage Loader exactly like the video -->
  <div id="loader">
    <div id="loader-text">0%</div>
  </div>

  <nav>
    <a href="#" class="nav-logo">EXY</a>
    <div class="nav-links">
      <a href="#work">Firmware</a>
      <a href="https://t.me/ExyROMs" target="_blank">Telegram</a>
    </div>
  </nav>

  <main>
    <!-- Light Hero Section -->
    <section class="hero">
      <h1 class="hero-title-huge">EXYROMS</h1>
      <h2 class="hero-subtitle">Developer</h2>
      
      <div class="ticker-wrap">
        <div class="ticker">
          <span class="ticker-item">EXYNOS 9611</span>
          <span class="ticker-item">ANDROID ROMS</span>
          <span class="ticker-item">CUSTOM KERNELS</span>
          <span class="ticker-item">RECOVERY</span>
          <span class="ticker-item">EXYNOS 9611</span>
          <span class="ticker-item">ANDROID ROMS</span>
          <span class="ticker-item">CUSTOM KERNELS</span>
          <span class="ticker-item">RECOVERY</span>
        </div>
      </div>
    </section>

    <!-- Dark Portfolio / Builds Section -->
    <section id="work" class="dark-section">
      <div class="container">
        <h2 class="section-title-dark">My <span>Work</span></h2>
        
        <div class="builds-list" id="buildsList">
          <!-- Firmware items generated by JavaScript here -->
        </div>
      </div>
    </section>

  </main>

  <footer>
    <h2 class="footer-huge">STILL BUILDING.</h2>
    <p style="font-family: var(--font-mono); font-weight: 700; margin-top: 2rem;">PROJECT EXYROMS &copy; 2026. BY PARBINDAR7.</p>
  </footer>

  <!-- Changelog Modal -->
  <div class="overlay" id="changelogModal" onclick="closeModal(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal(event, true)">[ CLOSE ]</button>
      <h3 class="modal-title" id="modalTitle">Changelog</h3>
      <div class="changelog-box" id="modalContent"></div>
    </div>
  </div>

  <script>
    // --- Pre-loader Logic ---
    document.addEventListener("DOMContentLoaded", () => {
      const loader = document.getElementById("loader");
      const loaderText = document.getElementById("loader-text");
      let progress = 0;
      
      const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 12) + 3;
        if (progress > 100) progress = 100;
        loaderText.innerText = progress + "%";
        
        if (progress === 100) {
          clearInterval(interval);
          setTimeout(() => { loader.classList.add("hidden"); }, 400);
        }
      }, 70);
    });

    // --- Original Full Database ---
    const buildsData = [
      {
        title: "Everline kernel", category: "kernel", device: "Samsung Galaxy A51, F41, M31, M31s, M21", android: "Android 13 to 16", date: "26 July 2026", maintainer: "PARBINDAR7", flavor: ["BALANCED"],
        changelog: "1. sched/uclamp: Move tunables to cpuctl\n2. sched/uclamp: Expose latency_sensitive and uclamp.boosted\n\n[NOTICE] Only support builds 25.07.2026 or newer.",
        downloadUrl: "https://sourceforge.net/projects/parbindar7-builds/files/Everline%2025-07-2026/"
      },
      {
        title: "Project Matrixx", category: "rom", device: "A51, F41, M31, M31s, M21", android: "Android 16", date: "May 2026", maintainer: "PARBINDAR7", flavor: ["INACTIVE"],
        changelog: "1. Contains all previous commits\n\n[NOTICE] Project Matrixx OS has been officially discontinued.",
        downloadUrl: "https://sourceforge.net/projects/projectmatrixx/files/Android-16/"
      },
      {
        title: "InfinityX v3.10", category: "rom", device: "A51, F41, M31, M31s, M21", android: "Android 16", date: "05 May 2026", maintainer: "PARBINDAR7", flavor: ["GAPPS INCLUDED"],
        changelog: "1. Contains all previous commits\n2. OTA push",
        downloadUrl: "https://github.com/Parbindar7/OTA/releases/tag/InfinityX_06-05-2026"
      },
      {
        title: "Afterlife OS", category: "rom", device: "A51, F41, M31, M31s, M21", android: "Android 16", date: "23 Apr 2026", maintainer: "PARBINDAR7", flavor: ["INACTIVE"],
        changelog: "1. Enable frame pacing\n2. Define screenRecorderAVCProfileLevel\n3. Decrease launch boost to 3sec\n4. Tune schedutil rate limits",
        downloadUrl: "https://afterlifeos.com/download"
      },
      {
        title: "Lineage OS v23.2", category: "rom", device: "A51, F41, M31, M31s, M21", android: "Android 16", date: "26 Jun 2026", maintainer: "PARBINDAR7", flavor: ["VANILLA"],
        changelog: "1. Refactor Powerhint.json\n2. Tune up/down frequency rate limits",
        downloadUrl: "https://drive.google.com/drive/folders/1sUjnPe88Q6sRX2-8nxYO37ac-MDAmhyj?usp=sharing"
      },
      {
        title: "Voltage OS v5.8", category: "rom", device: "A51, F41, M31, M31s, M21", android: "Android 16", date: "25 Apr 2026", maintainer: "PARBINDAR7", flavor: ["VANILLA"],
        changelog: "1. Re-tune POWERHINT for efficiency\n2. Boost CPU on EXPENSIVE_RENDERING",
        downloadUrl: "https://drive.google.com/drive/folders/16UW_O8Megsh4MpqPprNJgv4JV1j4taP5?usp=sharing"
      },
      {
        title: "LunarisAOSP v3.12", category: "rom", device: "A51, F41, M31, M31s, M21", android: "Android 16", date: "01 Jul 2026", maintainer: "PARBINDAR7", flavor: ["VANILLA"],
        changelog: "1. Remove unused /dev/freezer\n2. Tune up/down frequency transition rate limits",
        downloadUrl: "https://drive.google.com/drive/folders/1_RG0oDENhUGLcEh5kDkDNwOtc5VT5s3t"
      },
      {
        title: "LineageOS EXT", category: "rom", device: "A51, F41, M31, M31s, M21", android: "Android 17", date: "10 Aug 2026", maintainer: "PARBINDAR7", flavor: ["VANILLA"],
        changelog: "1. Update included soong namespaces\n2. Disable app launch blur",
        downloadUrl: "https://drive.google.com/drive/folders/11VAKKkzQEnQ-hCucJFv6She-AtUQNiDo?usp=sharing"
      },
      {
        title: "PixelOS v16.2", category: "rom", device: "A51, F41, M31, M31s, M21", android: "Android 16", date: "17 Aug 2026", maintainer: "PARBINDAR7", flavor: ["GAPPS"],
        changelog: "1. GPU Frequency set to 949mhz\n2. Blur disabled",
        downloadUrl: "https://drive.google.com/drive/folders/1y9wpS1P07NaXY9XiLxwQLYonk-ucRgDv"
      },
      {
        title: "TWRP Recovery", category: "recovery", device: "All Supported Devices", android: "Android 13 - 17", date: "2026", maintainer: "TWRP Team", flavor: ["ZIP/TAR"],
        changelog: "1. Fully compatible with Android 16 & 17 custom ROMs",
        downloadUrl: "https://twrp.me/Devices/"
      }
    ];

    // --- Modal Logic ---
    const modal = document.getElementById("changelogModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalContent = document.getElementById("modalContent");

    function openModal(title, content) {
      modalTitle.innerText = title;
      modalContent.innerHTML = content.replace(/\n/g, '<br>');
      modal.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeModal(e, force = false) {
      if (force || e.target === modal) {
        modal.classList.remove("active");
        document.body.style.overflow = "";
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal(e, true);
    });

    // --- Build List Generator ---
    function renderBuilds() {
      const container = document.getElementById("buildsList");
      let htmlBuffer = "";

      buildsData.forEach((item) => {
        const cat = (item.category || "rom").toUpperCase();
        const safeChangelog = (item.changelog || '').trim().replace(/'/g, "\\'").replace(/"/g, '&quot;');
        const titleClean = item.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');

        htmlBuffer += `
          <div class="build-row">
            <div>
              <div class="build-name">${item.title}</div>
              <div class="build-device">${item.device}</div>
            </div>

            <div class="build-meta">
              <span class="meta-label">TARGET OS</span>
              <span>${item.android}</span>
            </div>

            <div class="build-meta">
              <span class="meta-label">TYPE</span>
              <span>${cat}</span>
            </div>

            <div class="build-actions">
              <button class="btn-brutal" onclick="openModal('${titleClean}', '${safeChangelog}')">COMMITS</button>
              <a href="${item.downloadUrl}" target="_blank" rel="noopener noreferrer" class="btn-brutal" style="background: var(--text-light); color: var(--bg-black);">DEPLOY</a>
            </div>
          </div>
        `;
      });

      container.innerHTML = htmlBuffer;
    }

    renderBuilds();
  </script>
</body>
</html>
